<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="description" content="Selected investment research by Oliver Zhang.">
  <title>Oliver Zhang</title>
  <link rel="stylesheet" href="styles.css?v=20261005-4">
</head>
<body>
  <main class="layout">
    <aside class="sidebar">
      <h1><a href="#about">Oliver Zhang</a></h1>
      <nav>
        <a href="#about" data-link="about">About</a>
        <a href="#spot" data-link="spot">Short SPOT (Oct 2026)</a>
      </nav>
    </aside>

    <section class="content">
      <article id="about" class="panel">
        <h2>About</h2>
        <p>Selected fundamental equity research.</p>
      </article>

      <article id="spot" class="panel" hidden>
        <h2>Short SPOT (Oct 2026)</h2>\n        <img class="spot-hero" src="files/spotify-logo-hero.jpg" alt="Spotify logo on a dark background">
        <p><a class="artifact-link" href="files/Short-SPOT.pdf" target="_blank" rel="noopener">Pitch Writeup</a></p>
        <p><a class="artifact-link" href="https://view.officeapps.live.com/op/view.aspx?src=https%3A%2F%2Foliverzhang2024-wq.github.io%2Ffiles%2FShort-SPOT.xlsx" target="_blank" rel="noopener">Model</a></p>
      </article>
    </section>
  </main>

  <script>
    const panels = [...document.querySelectorAll(".panel")];
    const links = [...document.querySelectorAll("[data-link]")];

    function show(id) {
      const target = document.getElementById(id) || document.getElementById("about");
      panels.forEach(panel => panel.hidden = panel !== target);
      links.forEach(link => link.classList.toggle("active", link.dataset.link === target.id));
    }

    function sync() {
      show(location.hash.replace("#", "") || "about");
    }

    window.addEventListener("hashchange", sync);
    sync();
  </script>
</body>
</html>
